# SAIL Crewing - Local Testing nginx configuration (Windows)
#
# Use this to test the full production setup locally before deploying.
#
# Steps:
#   1. npm run build:prod
#   2. npm run start:prod   (or: pm2 start ecosystem.config.cjs)
#   3. Copy this into your local nginx.conf inside the http { } block
#   4. nginx -t && nginx -s reload
#   5. Open http://localhost:8080/crewing/

server {
    listen 8080;
    server_name localhost;

    # ===============================================
    # CREWING API (proxied to backend on port 4000)
    # ===============================================
    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ===============================================
    # CREWING STATIC ASSETS (JS, CSS, images)
    # ===============================================
    location /crewing/assets/ {
        alias C:/GitHub/crewing_upgraded_build/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ===============================================
    # FIGMA ASSETS
    # ===============================================
    location /figmaAssets/ {
        alias C:/GitHub/crewing_upgraded_build/dist/public/figmaAssets/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ===============================================
    # REACT APP (catch-all for /crewing/ SPA routing)
    # ===============================================
    location /crewing/ {
        alias C:/GitHub/crewing_upgraded_build/dist/public/;
        try_files $uri $uri/ /crewing/index.html;

        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
}
