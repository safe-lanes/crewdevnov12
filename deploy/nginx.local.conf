# SAIL Crewing - Complete Local Testing nginx.conf (Windows)
#
# This is a FULL, self-contained nginx.conf file ready to use.
# Replace your entire nginx.conf with this file for local testing.
#
# Prerequisites:
#   1. nginx installed on Windows (e.g., C:\nginx\)
#   2. Project built: npm run build:prod
#   3. Backend running: npm run start:prod  (or pm2 start ecosystem.config.cjs)
#
# Usage:
#   1. Copy this file to C:\nginx\conf\nginx.conf
#   2. Run: nginx -t       (test config)
#   3. Run: nginx           (start)  or  nginx -s reload  (if already running)
#   4. Open: http://localhost:8080/crewing/

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for faster loading
    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length  256;

    # Logging (adjust paths to match your nginx installation)
    access_log  logs/crewing_access.log;
    error_log   logs/crewing_error.log;

    server {
        listen       8080;
        server_name  localhost;

        # -------------------------------------------
        # API — proxied to backend (port 4000)
        # -------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:4000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # -------------------------------------------
        # Static assets (JS/CSS) — long cache
        # -------------------------------------------
        location /crewing/assets/ {
            alias C:/GitHub/crewing_upgraded_build/dist/public/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # -------------------------------------------
        # Figma assets
        # -------------------------------------------
        location /figmaAssets/ {
            alias C:/GitHub/crewing_upgraded_build/dist/public/figmaAssets/;
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # -------------------------------------------
        # React app — SPA catch-all
        # -------------------------------------------
        location /crewing/ {
            alias C:/GitHub/crewing_upgraded_build/dist/public/;
            try_files $uri $uri/ /crewing/index.html;

            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # -------------------------------------------
        # Root redirect → /crewing/
        # -------------------------------------------
        location = / {
            return 301 /crewing/;
        }

        # -------------------------------------------
        # Error pages
        # -------------------------------------------
        error_page  500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
